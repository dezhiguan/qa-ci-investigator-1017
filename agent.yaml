kind: Agent
spec:
  auth:
    audience: qa-ci-investigator-1017
  eval:
    dataset: qa-ci-investigator-1017/seed
  kind: workflow
  audit:
    captureFields:
    - request_id
  tools:
  - name: ci.log.fetch
    risk: low
    access: read
    approval: none
  - name: keel.gate.report.read
    risk: low
    access: read
    approval: none
  - name: git.pr.diff
    risk: low
    access: read
    approval: none
  models:
    budget:
      dailyCny: 10.0
    default: qwen-plus
  prompts:
    items:
    - name: role
      type: text
    source: langfuse
  runtime:
    type: code
    endpoint: http://qa-ci-investigator-1017.agents.svc.cluster.local:8000
    language: python
    liveness: k8s
  knowledge: []
  guardrails:
    pii: mask
    grounding: 'off'
    inputInjection: enforce
metadata:
  name: qa-ci-investigator-1017
  owner: 平台组 / 官德志
  displayName: CI 故障调查助手
apiVersion: keel/v1
